name: CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Get code
      - uses: actions/checkout@v3

      # 2. Setup Java
      - uses: actions/setup-java@v3
        with:
          java-version: '17'

      # 3. Build JAR
      - name: Build JAR
        run: mvn clean package -DskipTests

      # 4. Build Docker image
      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/task-manager .

      # 5. Login Docker Hub
      - name: Docker login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 6. Push Docker image
      - name: Push image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/task-manager